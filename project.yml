name: Fridge
options:
  bundleIdPrefix: com.moooofan
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "P9Z76UZ829"
    CODE_SIGN_STYLE: Automatic
  configs:
    # dSYMs for Xcode Organizer / App Store Connect crash symbolication
    # (independent of MetricKit, which reports its own already-symbolicated
    # diagnostics — see Fridge/Services/Analytics.swift).
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.2
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.0.0
  LineSDK:
    url: https://github.com/line/line-sdk-ios-swift
    from: 5.17.0

targets:
  Fridge:
    type: application
    platform: iOS
    sources:
      - path: Fridge
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: LineSDK
        product: LineSDK
      # Crash/diagnostic reporting (Fridge/Services/Analytics.swift) — system
      # framework, no SPM package needed.
      - sdk: MetricKit.framework
    settings:
      base:
        INFOPLIST_FILE: Fridge/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.moooofan.fridge
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Fridge/Fridge.entitlements
    info:
      path: Fridge/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "需要使用相機拍攝食材照片"
        NSPhotoLibraryUsageDescription: "需要存取相簿選擇食材照片"
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Fridge
        CFBundleName: Fridge
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleURLTypes:
          - CFBundleURLName: GoogleSignIn
            CFBundleURLSchemes:
              - com.googleusercontent.apps.176873357933-nupno83m42l7diee46537c9eiqkc2ebc
          - CFBundleURLName: LineSDK
            CFBundleURLSchemes:
              - "line3rdp.$(PRODUCT_BUNDLE_IDENTIFIER)"
          - CFBundleURLName: SupabaseAuthCallback
            CFBundleURLSchemes:
              - fridge
        LSApplicationQueriesSchemes:
          - lineauth2

schemes:
  Fridge:
    build:
      targets:
        Fridge: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
